appId: ltd.decoy.visualomp
productName: visual-omp
asar: true
directories:
  buildResources: build
  output: release
# Electron's own UI strings (native dialogs, context menus). The app UI is English only. "en" keeps
# en.lproj on macOS; "en-US" keeps locales/en-US.pak on Windows, where "en" alone matches no file.
electronLanguages:
  - en
  - en-US
files:
  - out/**/*
  - "!out/**/*.map"
  - package.json
  - LICENSE
  - NOTICE
  # node-pty at runtime needs lib/*.js and the addon electron-builder rebuilds for the target
  # Electron and arch into build/Release, which node-pty loads first: pty.node and spawn-helper on
  # macOS; pty.node, conpty.node, conpty_console_list.node, winpty.dll and winpty-agent.exe on
  # Windows. The bundled prebuilds go unused (and their macOS spawn-helper is not executable), as
  # do sources, build intermediates and the header-only node-addon-api dependency.
  - "!node_modules/node-pty/{binding.gyp,README.md,deps,node-addon-api,prebuilds,scripts,src,third_party,typings}{,/**/*}"
  - "!node_modules/node-pty/build/!(Release){,/**/*}"
  - "!node_modules/node-pty/build/Release/!(*.node|*.dll|*.exe|spawn-helper|conpty){,/**/*}"
  - "!node_modules/node-pty/lib/**/*.{map,test.js}"
  - "!node_modules/node-addon-api{,/**/*}"
asarUnpack:
  - node_modules/node-pty/**/*
artifactName: visual-omp-${version}-${platform}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  # Ad-hoc sign the whole bundle. Without an identity, electron-builder skips signing and ships only
  # Electron's linker signature, which macOS rejects as "damaged" once the app is quarantined.
  # Disable hardened runtime for compatibility with ad-hoc signed native modules.
  # This also gives up runtime protections against code injection and library loading.
  identity: "-"
  hardenedRuntime: false
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  minimumSystemVersion: "12.0"
dmg:
  artifactName: visual-omp-${version}-mac-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: visual-omp-${version}-win-${arch}.${ext}
publish:
  - provider: github
    owner: decoy-dev
    repo: visual-omp

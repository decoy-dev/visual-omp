name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure tag matches package version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node -e 'const expected = `v${require("./package.json").version}`; if (process.env.GITHUB_REF_NAME !== expected) { console.error(`Expected tag ${expected}, received ${process.env.GITHUB_REF_NAME}`); process.exit(1); }'
      - name: Extract this version's notes from CHANGELOG.md
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Classify the release channel
        id: channel
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # A semver prerelease has a "-" before any "+build" metadata (1.2.0-beta.1, 1.2.0-next).
          version="${GITHUB_REF_NAME#v}"
          case "${version%%+*}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
      - run: npm run typecheck
      - run: npm test

  macos:
    needs: verify
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the macOS application without signing credentials
        run: npm run build
      # Every release is signed with the project's own certificate, so each release keeps one code signing identity
      # (scripts/sign-mac.mjs). macOS records permissions people grant visual-omp against that identity; an ad hoc
      # signed release would get a new one. A missing certificate therefore stops the release, and the signed apps
      # are checked for the expected certificate. The certificate goes into a temporary keychain that this step
      # creates and deletes; electron-builder's own CSC_LINK import is not used.
      - name: Package and sign the macOS installers
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # codesign accepts the certificate's SHA-1 in place of its name, which avoids matching a self-signed
          # identity by name.
          VOMP_MAC_IDENTITY: 078ca0c88536695e0c46e2b61b43f565783af802
          VOMP_MAC_CERT_SHA1: 078ca0c88536695e0c46e2b61b43f565783af802
        run: |
          if [ -z "$MAC_SIGNING_P12" ] || [ -z "$MAC_SIGNING_P12_PASSWORD" ]; then
            echo "::error::The MAC_SIGNING_P12 and MAC_SIGNING_P12_PASSWORD secrets are required to sign macOS releases."
            exit 1
          fi
          umask 077
          work="$(mktemp -d "$RUNNER_TEMP/signing.XXXXXX")"
          keychain="$work/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          # The first v0.6.7 CI run imported the identity but codesign could not find it. Add the temporary keychain
          # to the user search list, matching electron-builder's approach, and restore the list afterward.
          original_keychain_list="$(security list-keychains -d user)"
          original_keychains=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%\"}"
            line="${line#\"}"
            if [ -n "$line" ]; then
              original_keychains+=("$line")
            fi
          done <<< "$original_keychain_list"
          cleanup() {
            security list-keychains -d user -s "${original_keychains[@]}" 2>/dev/null || true
            security delete-keychain "$keychain" 2>/dev/null || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          printf '%s' "$MAC_SIGNING_P12" | base64 -d > "$work/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$work/signing.p12" -k "$keychain" -P "$MAC_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          unset MAC_SIGNING_P12 MAC_SIGNING_P12_PASSWORD
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          rm "$work/signing.p12"
          security list-keychains -d user -s "$keychain" "${original_keychains[@]}"
          # Fail before packaging if security find-identity does not list the expected certificate. The certificate is
          # self-signed, so it is listed without -v; the hash is matched case-insensitively.
          identities="$(security find-identity -p codesigning "$keychain")"
          echo "$identities"
          if ! grep -qi "$VOMP_MAC_CERT_SHA1" <<< "$identities"; then
            echo "::error::The signing keychain holds no identity for the visual-omp certificate."
            exit 1
          fi
          CSC_KEYCHAIN="$keychain" ./node_modules/.bin/electron-builder --mac dmg --arm64 --x64 --publish never
          for app in release/mac*/visual-omp.app; do
            requirement="$(codesign -dr - "$app" 2>&1)"
            echo "$app: $requirement"
            case "$requirement" in
              *"certificate root = H\"$VOMP_MAC_CERT_SHA1\""*) ;;
              *) echo "::error::$app is not signed with the visual-omp certificate"; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-installers
          path: release/*.dmg
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  publish:
    needs: [verify, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One publish at a time, so overlapping tags cannot interleave their cask commits.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-installer*"
          path: release-assets
          merge-multiple: true
      # Notes come from the tagged commit (extracted in verify), whatever main holds by now.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: release-notes
      # Only the newest stable version is marked Latest on the releases page, so a stable tag published
      # after a newer one leaves the label where it is. Prereleases skip this and are never Latest.
      - name: Decide whether this release is marked Latest
        id: latest
        if: needs.verify.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          make_latest="$(node scripts/make-latest.mjs "${GITHUB_REF_NAME#v}" <<< "$tags")"
          echo "make_latest=${make_latest}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes/release-notes.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.latest.outputs.make_latest }}
          files: release-assets/*
      # The cask and the Scoop manifest are the stable channel: prereleases never reach
      # `brew upgrade` or `scoop update`. Each script leaves its file alone when it already offers
      # a newer version (scripts/stable-channel.mjs), so an older tag never moves users back.
      - name: Update Homebrew cask and Scoop manifest from published installers
        if: needs.verify.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          arm64_sha="$(sha256sum "release-assets/visual-omp-${version}-mac-arm64.dmg" | cut -d' ' -f1)"
          x64_sha="$(sha256sum "release-assets/visual-omp-${version}-mac-x64.dmg" | cut -d' ' -f1)"
          win_sha="$(sha256sum "release-assets/visual-omp-${version}-win-x64.exe" | cut -d' ' -f1)"
          node scripts/update-homebrew-cask.mjs "$version" "$arm64_sha" "$x64_sha"
          node scripts/update-scoop-manifest.mjs "$version" "$win_sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/visual-omp.rb bucket/visual-omp.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update Homebrew cask and Scoop manifest for v${version}"
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
            echo "::add-mask::$auth"
            GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              git push origin HEAD:main
          fi

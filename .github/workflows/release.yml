name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure tag matches package version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node -e 'const expected = `v${require("./package.json").version}`; if (process.env.GITHUB_REF_NAME !== expected) { console.error(`Expected tag ${expected}, received ${process.env.GITHUB_REF_NAME}`); process.exit(1); }'
      - name: Extract this version's notes from CHANGELOG.md
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Classify the release channel
        id: channel
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # A semver prerelease has a "-" before any "+build" metadata (1.2.0-beta.1, 1.2.0-next).
          version="${GITHUB_REF_NAME#v}"
          case "${version%%+*}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
      - run: npm run typecheck
      - run: npm test

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: release/*.dmg
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  publish:
    needs: [verify, macos, windows]
    runs-on: ubuntu-latest
    # One publish at a time, so overlapping tags cannot interleave their cask commits.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-installer*"
          path: release-assets
          merge-multiple: true
      # Notes come from the tagged commit (extracted in verify), whatever main holds by now.
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes/release-notes.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          files: release-assets/*
      # The cask is the stable channel: prereleases never reach `brew upgrade`.
      - name: Update Homebrew cask from published installers
        if: needs.verify.outputs.prerelease != 'true'
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          arm64_sha="$(sha256sum "release-assets/visual-omp-${version}-mac-arm64.dmg" | cut -d' ' -f1)"
          x64_sha="$(sha256sum "release-assets/visual-omp-${version}-mac-x64.dmg" | cut -d' ' -f1)"
          node scripts/update-homebrew-cask.mjs "$version" "$arm64_sha" "$x64_sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/visual-omp.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(homebrew): update cask for v${version}"
            git push origin HEAD:main
          fi

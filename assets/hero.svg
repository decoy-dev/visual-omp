  <text class="ui" x="750" y="324" text-anchor="middle" font-weight="700" font-size="64" letter-spacing="-0.02em" fill="#F2F6FA">The agent stays. The terminal goes.</text>
  <text class="ui" x="750" y="376" text-anchor="middle" font-weight="400" font-size="20" fill="#9DA9B8">visual-omp is a friendly desktop window around omp, the AI coding agent.</text>
